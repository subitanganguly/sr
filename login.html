<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


    <style>

        html, body {
            min-height: 100vh;
            margin: 0;
            background: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
        }


        /* =====================================================
           WELCOME SPLASH  —  MATTE WHITE
           ===================================================== */

        #welcomeScreen {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #ffffff;
            background-image:
                radial-gradient(
                    circle at 50% 0%,
                    #f7f9fc 0%,
                    #ffffff 60%
                );
            overflow: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #welcomeScreen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        /* Soft pastel blobs — keeps the white matte, not flat-dead */

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            pointer-events: none;
        }

        .orb-1 {
            width: 420px; height: 420px;
            background: #dbeafe;
            top: -120px; left: -120px;
            animation: floatOrb 14s ease-in-out infinite;
        }

        .orb-2 {
            width: 380px; height: 380px;
            background: #fce7f3;
            bottom: -140px; right: -100px;
            animation: floatOrb 18s ease-in-out infinite reverse;
        }

        .orb-3 {
            width: 260px; height: 260px;
            background: #fef3c7;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: floatOrb 22s ease-in-out infinite;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(40px, -30px) scale(1.08); }
        }

        .orb-3 {
            animation-name: floatOrbCenter;
        }

        @keyframes floatOrbCenter {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50%      { transform: translate(-46%, -54%) scale(1.10); }
        }


        /* Content */

        .welcome-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #0f172a;
            max-width: 760px;
        }


        /* ---------- LOGO ---------- */

        .welcome-logo {
            width: 250px;
            height: 250px;
            margin: 0 auto 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: logoPop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
        }

        .welcome-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 16px;
            display: block;
        }

        /* Shown only if the logo image fails to load */
        .welcome-logo .logo-fallback {
            display: none;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 52px;
            color: #0d6efd;
        }

        @keyframes logoPop {
            0%   { transform: scale(0.4) rotate(-30deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }


        /* ---------- TEXT ---------- */

        .welcome-title {
            font-size: clamp(1.6rem, 4vw, 2.6rem);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.5px;
            margin: 0;
            color: #0f172a;
            animation: fadeUp 0.9s ease 0.35s both;
        }

        .welcome-sub {
            font-size: clamp(0.95rem, 1.6vw, 1.15rem);
            margin-top: 14px;
            color: #64748b;
            font-weight: 400;
            animation: fadeUp 0.9s ease 0.55s both;
        }

        @keyframes fadeUp {
            0%   { opacity: 0; transform: translateY(22px); }
            100% { opacity: 1; transform: translateY(0); }
        }


        /* ---------- GET STARTED BUTTON ---------- */

        .btn-start {
            margin-top: 34px;
            padding: 14px 38px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 999px;
            border: 2px solid #0d6efd;
            background: #0d6efd;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 26px rgba(13, 110, 253, 0.22);
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease;
            animation: fadeUp 0.9s ease 0.75s both;
        }

        .btn-start:hover,
        .btn-start:focus {
            transform: translateY(-3px);
            background: #0b5ed7;
            border-color: #0b5ed7;
            color: #ffffff;
            box-shadow: 0 16px 34px rgba(13, 110, 253, 0.28);
            outline: none;
        }

        .btn-start i {
            transition: transform 0.25s ease;
        }

        .btn-start:hover i {
            transform: translateX(4px);
        }


        /* =====================================================
           LOGIN SCREEN
           ===================================================== */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            transform: translateY(30px);
            pointer-events: none;
            transition: opacity 0.6s ease 0.15s,
                        transform 0.6s ease 0.15s;
        }

        #loginScreen.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }


        .login-card {
            width: 100%;
            max-width: 400px;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }


        .login-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #0d6efd;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;

            font-size: 30px;
        }


        .form-control {
            min-height: 48px;
        }


        .login-btn {
            min-height: 48px;
        }


        #message {
            display: none;
        }


        /* Login card entrance animation */

        #loginScreen.show .login-card {
            animation: cardIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
        }

        @keyframes cardIn {
            0%   { opacity: 0; transform: translateY(24px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         WELCOME SPLASH
         ===================================================== -->

    <div id="welcomeScreen">

        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>


        <div class="welcome-content">

            <!-- LOGO -->
            <div class="welcome-logo">

                <img
                    src="logo.png"
                    alt="SR Group Logo"
                    id="brandLogo">

                <!-- Fallback icon (only if the logo file is missing) -->
                <span
                    class="logo-fallback"
                    id="logoFallback">

                    <i class="bi bi-grid-1x2-fill"></i>

                </span>

            </div>

            <h1 class="welcome-title">
                Welcome to SR Group<br>
                Business Management
            </h1>

            <p class="welcome-sub">
                Manage your business, bills, and team in one place.
            </p>

            <button
                type="button"
                class="btn-start"
                id="getStartedBtn">

                Get Started
                <i class="bi bi-arrow-right"></i>

            </button>

        </div>

    </div>


    <!-- =====================================================
         LOGIN SCREEN
         ===================================================== -->

    <div id="loginScreen">

        <div class="container px-3">

            <div class="card login-card mx-auto">

                <div class="card-body p-4 p-md-5">

                    <!-- Login Icon -->

                    <div class="login-icon">

                        <i class="bi bi-person-lock"></i>

                    </div>


                    <h3 class="text-center fw-bold mb-1">

                        Welcome Back

                    </h3>


                    <p class="text-center text-muted mb-4">

                        Sign in to continue

                    </p>


                    <!-- Message -->

                    <div
                        id="message"
                        class="alert"
                        role="alert">
                    </div>


                    <!-- Login Form -->

                    <form id="loginForm">


                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label">

                                Email

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-envelope"></i>

                                </span>


                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    autocomplete="email"
                                    required>

                            </div>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label">

                                Password

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock"></i>

                                </span>


                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required>


                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    id="togglePassword">

                                    <i
                                        class="bi bi-eye"
                                        id="eyeIcon">
                                    </i>

                                </button>

                            </div>

                        </div>


                        <!-- Login Button -->

                        <button
                            type="submit"
                            id="loginBtn"
                            class="btn btn-primary w-100 login-btn">


                            <span id="loginText">

                                <i class="bi bi-box-arrow-in-right me-2"></i>

                                Login

                            </span>


                            <span
                                id="loadingText"
                                class="d-none">

                                <span
                                    class="spinner-border spinner-border-sm me-2">
                                </span>

                                Checking...

                            </span>


                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>



    <!-- =====================================================
         LOGIN JAVASCRIPT
    ====================================================== -->

    <script type="module">


        // =====================================================
        // FIREBASE CONFIG
        // =====================================================

        import {
            auth,
            db
        } from "./firebase-config.js";


        // =====================================================
        // FIREBASE AUTH
        // =====================================================

        import {
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


        // =====================================================
        // REALTIME DATABASE
        // =====================================================

        import {
            ref,
            get
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";



        // =====================================================
        // ELEMENTS
        // =====================================================

        const welcomeScreen =
            document.getElementById("welcomeScreen");

        const loginScreen =
            document.getElementById("loginScreen");

        const getStartedBtn =
            document.getElementById("getStartedBtn");

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginBtn =
            document.getElementById("loginBtn");

        const loginText =
            document.getElementById("loginText");

        const loadingText =
            document.getElementById("loadingText");

        const message =
            document.getElementById("message");

        const togglePassword =
            document.getElementById("togglePassword");

        const eyeIcon =
            document.getElementById("eyeIcon");



        // =====================================================
        // LOGO FALLBACK
        // =====================================================
        //
        // If "logo.png" cannot be loaded (wrong path, missing
        // file, offline), we hide the <img> and show the
        // Bootstrap icon instead, so the splash never breaks.

        const brandLogo =
            document.getElementById("brandLogo");

        const logoFallback =
            document.getElementById("logoFallback");

        brandLogo.addEventListener("error", () => {

            brandLogo.style.display = "none";

            logoFallback.style.display = "flex";

        });



        // =====================================================
        // WELCOME → LOGIN TRANSITION
        // =====================================================

        let sessionChecked = false;

        function showLoginScreen() {

            welcomeScreen.classList.add("hide");

            // Wait for fade-out before revealing login
            setTimeout(() => {
                loginScreen.classList.add("show");

                // Focus email after the card settles
                setTimeout(() => {
                    try { emailInput.focus(); } catch (err) {}
                }, 500);
            }, 400);
        }

        getStartedBtn.addEventListener("click", showLoginScreen);

        // Allow Enter / Space on the button
        getStartedBtn.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                showLoginScreen();
            }
        });



        // =====================================================
        // ALLOWED ROLES
        // =====================================================
        //
        // Matches the Firebase Database rules: any of these roles
        // may sign in. What they can SEE / DO afterwards is
        // controlled by the rules + the individual pages.

        const allowedRoles = [
            "main-admin",
            "dev-admin",
            "owner",
            "business-admin",
            "project-admin"
        ];



        // =====================================================
        // SHOW MESSAGE
        // =====================================================

        function showMessage(text, type = "danger") {

            message.textContent = text;

            message.className =
                `alert alert-${type}`;

            message.style.display = "block";

        }



        // =====================================================
        // HIDE MESSAGE
        // =====================================================

        function hideMessage() {

            message.style.display = "none";

        }



        // =====================================================
        // PASSWORD SHOW / HIDE
        // =====================================================

        togglePassword.addEventListener(
            "click",
            () => {

                if (
                    passwordInput.type === "password"
                ) {

                    passwordInput.type = "text";

                    eyeIcon.className =
                        "bi bi-eye-slash";

                } else {

                    passwordInput.type = "password";

                    eyeIcon.className =
                        "bi bi-eye";

                }

            }
        );



        // =====================================================
        // LOADING
        // =====================================================

        function setLoading(loading) {

            loginBtn.disabled = loading;

            loginText.classList.toggle(
                "d-none",
                loading
            );

            loadingText.classList.toggle(
                "d-none",
                !loading
            );

        }



        // =====================================================
        // GET USER PROFILE
        // =====================================================

        async function getUserData(uid) {

            const userRef = ref(
                db,
                `sr_group/users/${uid}`
            );


            const snapshot =
                await get(userRef);


            if (!snapshot.exists()) {

                return null;

            }


            return {

                id: uid,

                ...snapshot.val()

            };

        }



        // =====================================================
        // LOGIN
        // =====================================================

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                hideMessage();


                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                const password =
                    passwordInput.value;


                setLoading(true);



                try {


                    // =========================================
                    // FIREBASE AUTHENTICATION
                    // =========================================

                    const userCredential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const firebaseUser =
                        userCredential.user;



                    // =========================================
                    // GET USER PROFILE
                    // =========================================

                    const userData =
                        await getUserData(
                            firebaseUser.uid
                        );



                    // =========================================
                    // PROFILE NOT FOUND
                    // =========================================

                    if (!userData) {

                        await signOut(auth);


                        showMessage(
                            "Your account profile was not found.",
                            "danger"
                        );


                        setLoading(false);

                        return;

                    }



                    // =========================================
                    // VERIFY UID
                    // =========================================

                    if (
                        userData.uid &&
                        userData.uid !== firebaseUser.uid
                    ) {

                        await signOut(auth);


                        showMessage(
                            "Account verification failed.",
                            "danger"
                        );


                        setLoading(false);

                        return;

                    }



                    // =========================================
                    // VERIFY EMAIL
                    // =========================================

                    if (
                        userData.email &&
                        userData.email.toLowerCase() !==
                        firebaseUser.email.toLowerCase()
                    ) {

                        await signOut(auth);


                        showMessage(
                            "Account verification failed.",
                            "danger"
                        );


                        setLoading(false);

                        return;

                    }



                    // =========================================
                    // VERIFY USER STATUS (user-status)
                    // =========================================

                    const isActive =
                        userData["user-status"] !== false &&
                        userData["user-status"] !== "false";

                    if (!isActive) {

                        await signOut(auth);


                        showMessage(
                            "This account has been disabled. Please contact your administrator.",
                            "danger"
                        );


                        setLoading(false);

                        return;

                    }



                    // =========================================
                    // GET ROLE
                    // =========================================

                    const role =
                        userData.role || "";



                    // =========================================
                    // CHECK ROLE
                    // =========================================

                    if (
                        !allowedRoles.includes(role)
                    ) {

                        await signOut(auth);


                        showMessage(
                            "You do not have permission to access this system.",
                            "danger"
                        );


                        setLoading(false);

                        return;

                    }



                    // =========================================
                    // SAVE SESSION
                    // =========================================

                    const userProfile = {

                        uid:
                            firebaseUser.uid,

                        userId:
                            userData.id,

                        username:
                            userData.username || "",

                        email:
                            firebaseUser.email || "",

                        name:
                            userData.name || "",

                        role:
                            role,

                        // Include access scopes in the cached profile
                        // so the sidebar can render menus without a
                        // second roundtrip.
                        businessAccess:
                            userData.businessAccess || null,

                        projectAccess:
                            userData.projectAccess || null,

                        measurementSheetAccess:
                            userData.measurementSheetAccess === true

                    };


                    sessionStorage.setItem(
                        "userProfile",
                        JSON.stringify(userProfile)
                    );



                    // =========================================
                    // SUCCESS
                    // =========================================

                    showMessage(
                        `Welcome ${userData.name || userData.username || ""}`,
                        "success"
                    );



                    // =========================================
                    // REDIRECT
                    // =========================================

                    setTimeout(() => {

                        window.location.href =
                            "index.html";

                    }, 500);


                } catch (error) {


                    console.error(
                        "Login Error:",
                        error
                    );


                    let errorMessage =
                        "Unable to login.";


                    switch (error.code) {


                        case "auth/invalid-credential":

                            errorMessage =
                                "Invalid email or password.";

                            break;


                        case "auth/invalid-email":

                            errorMessage =
                                "Please enter a valid email address.";

                            break;


                        case "auth/user-disabled":

                            errorMessage =
                                "This account has been disabled.";

                            break;


                        case "auth/too-many-requests":

                            errorMessage =
                                "Too many login attempts. Please try again later.";

                            break;


                        case "auth/network-request-failed":

                            errorMessage =
                                "Network error. Please check your internet connection.";

                            break;


                        default:

                            errorMessage =
                                "Login failed.";

                    }


                    showMessage(
                        errorMessage,
                        "danger"
                    );


                    setLoading(false);

                }

            }
        );



        // =====================================================
        // CHECK EXISTING LOGIN
        // =====================================================

        onAuthStateChanged(
            auth,
            async (user) => {


                if (!user) {

                    return;

                }


                // Only auto-redirect once
                if (sessionChecked) {
                    return;
                }

                sessionChecked = true;


                try {


                    const userData =
                        await getUserData(
                            user.uid
                        );



                    if (
                        userData &&
                        allowedRoles.includes(
                            userData.role
                        )
                    ) {


                        const isActive =
                            userData["user-status"] !== false &&
                            userData["user-status"] !== "false";

                        if (!isActive) {

                            await signOut(auth);

                            return;

                        }


                        const userProfile = {

                            uid:
                                user.uid,

                            userId:
                                userData.id,

                            username:
                                userData.username || "",

                            email:
                                user.email || "",

                            name:
                                userData.name || "",

                            role:
                                userData.role,

                            businessAccess:
                                userData.businessAccess || null,

                            projectAccess:
                                userData.projectAccess || null,

                            measurementSheetAccess:
                                userData.measurementSheetAccess === true

                        };


                        sessionStorage.setItem(
                            "userProfile",
                            JSON.stringify(userProfile)
                        );


                        window.location.href =
                            "index.html";

                    }

                } catch (error) {

                    console.error(
                        "Session check failed:",
                        error
                    );

                }

            }
        );

    </script>

</body>

</html>
